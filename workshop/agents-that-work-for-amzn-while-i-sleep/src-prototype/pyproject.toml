[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "multi-agent-ticketing"
version = "0.1.0"
description = "Autonomous multi-agent system for JIRA ticket processing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.25.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "anyio>=4.3.0",
    "watchfiles>=0.21.0",   # hot-reload for skills
    "croniter>=2.0.3",      # cron expression parsing
    "click>=8.1.7",         # CLI entry points
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",        # mock HTTPX clients
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
agent-loop    = "triggers.shell_loop:main"
agent-cron    = "triggers.cron_trigger:main"
agent-sop     = "orchestration.sop_engine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

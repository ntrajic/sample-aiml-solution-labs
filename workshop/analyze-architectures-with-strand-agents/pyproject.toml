[project]
name = "workshop"
version = "0.9.0"
description = "Architecture diagrams with generative AI: Leveraging AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.41.2",
    "defusedxml>=0.7.1",
    "diagrams>=0.25.0",
    "fastmcp>=2.13.1",
    "marko>=2.2.1",
    "pillow>=11.3.0",
    "pydantic>=2.12.4",
    "requests>=2.32.5",
    "strands-agents>=1.18.0",
    "strands-agents-tools>=0.2.16",
]

# https://docs.astral.sh/ruff/settings/
[tool.ruff.lint]
# Note: if you're using Ruff to organize imports in VS Code and also expect to run Ruff from the command line, you'll want to enable Ruff's isort rules by adding "I" to your extend-select.
extend-select = ["I"]

[tool.bandit]
exclude_dirs = [".venv"]